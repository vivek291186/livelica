<h2>The spacer is the usual culprit</h2>
<svg viewbox="0 0 820 340" role="img" aria-label="Three cross sections of an inline skate wheel hub" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="340" fill="#0f172a"></rect><text x="410" y="38" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Spacer length and what you hear</text><rect x="30" y="90" width="230" height="120" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect><rect x="52" y="120" width="30" height="60" rx="4" fill="#38bdf8"></rect><rect x="208" y="120" width="30" height="60" rx="4" fill="#38bdf8"></rect><rect x="82" y="138" width="126" height="24" rx="4" fill="#22c55e"></rect><text x="145" y="236" fill="#22c55e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Spacer matched</text><text x="145" y="260" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">bearings sit flush with</text><text x="145" y="278" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">the hub faces, quiet</text><rect x="295" y="90" width="230" height="120" rx="16" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect><rect x="300" y="120" width="30" height="60" rx="4" fill="#38bdf8"></rect><rect x="490" y="120" width="30" height="60" rx="4" fill="#38bdf8"></rect><rect x="330" y="138" width="160" height="24" rx="4" fill="#f97316"></rect><text x="410" y="236" fill="#f97316" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Spacer too long</text><text x="410" y="260" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">bearings stand proud, hub</text><text x="410" y="278" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">shuffles on them, clicks</text><rect x="560" y="90" width="230" height="120" rx="16" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect><rect x="600" y="120" width="30" height="60" rx="4" fill="#38bdf8"></rect><rect x="720" y="120" width="30" height="60" rx="4" fill="#38bdf8"></rect><rect x="630" y="138" width="90" height="24" rx="4" fill="#f97316"></rect><text x="675" y="236" fill="#f97316" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Spacer too short</text><text x="675" y="260" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">bearings pulled inward and</text><text x="675" y="278" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">pinched, drag not noise</text><text x="410" y="318" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle">blue: bearings, green and orange: the spacer between them</text></svg>
