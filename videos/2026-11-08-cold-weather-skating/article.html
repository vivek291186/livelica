<h2>What cold does to a urethane wheel</h2>
<div style="margin:26px 0;"><svg viewbox="0 0 820 320" role="img" aria-label="Diagram comparing a warm wheel with a larger deformed contact patch against a cold wheel with a smaller stiffer contact patch" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="320" fill="#0f172a"></rect><text x="32" y="42" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold">Same wheel, two temperatures</text><circle cx="215" cy="150" r="78" fill="none" stroke="#f97316" stroke-width="10"></circle><circle cx="215" cy="150" r="30" fill="none" stroke="#475569" stroke-width="8"></circle><line x1="90" y1="232" x2="340" y2="232" stroke="#94a3b8" stroke-width="4"></line><path d="M 178 228 Q 215 240 252 228" stroke="#f97316" stroke-width="7" fill="none"></path><text x="215" y="61" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Warm</text><text x="215" y="266" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Softer, flexes more</text><text x="215" y="290" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Wider contact patch, more grip</text><circle cx="605" cy="150" r="78" fill="none" stroke="#38bdf8" stroke-width="10"></circle><circle cx="605" cy="150" r="30" fill="none" stroke="#475569" stroke-width="8"></circle><line x1="480" y1="232" x2="730" y2="232" stroke="#94a3b8" stroke-width="4"></line><path d="M 588 229 Q 605 233 622 229" stroke="#38bdf8" stroke-width="7" fill="none"></path><text x="605" y="61" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Cold</text><text x="605" y="266" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Stiffer, flexes less</text><text x="605" y="290" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Narrower contact patch, less grip</text><line x1="400" y1="110" x2="400" y2="250" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"></line></svg></div>
<h2>Why the first few minutes feel like skating with the brakes on</h2>
<div style="margin:26px 0;"><svg viewbox="0 0 820 260" role="img" aria-label="Schematic timeline showing bearing roll improving over the first fifteen minutes of a cold session as the oil warms and thins" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="260" fill="#0f172a"></rect><text x="32" y="40" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold">The first fifteen minutes of a cold session</text><line x1="60" y1="190" x2="760" y2="190" stroke="#475569" stroke-width="3"></line><path d="M 70 150 C 200 148 300 120 420 108 S 650 100 750 98" stroke="#38bdf8" stroke-width="5" fill="none"></path><circle cx="70" cy="150" r="8" fill="#f97316"></circle><circle cx="750" cy="98" r="8" fill="#22c55e"></circle><text x="70" y="214" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Minute 0</text><text x="750" y="214" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Minute 15</text><text x="98" y="142" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="14">Thick oil, short roll, hard wheels</text><text x="440" y="100" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="14">Oil thinning, grip returning</text><text x="470" y="78" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14">Normal roll and grip</text></svg></div>
<h2>A cold body needs a longer warm up, not a braver first lap</h2>
<div style="margin:26px 0;"><svg viewbox="0 0 820 250" role="img" aria-label="Four stage cold morning sequence" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="250" fill="#0f172a"></rect><text x="32" y="40" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold">Cold morning session order</text><rect x="32" y="70" width="178" height="120" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="3"></rect><text x="121" y="104" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. Off skates</text><text x="121" y="130" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Easy movement,</text><text x="121" y="150" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">mobility, activation</text><text x="121" y="176" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">12 to 20 minutes</text><rect x="226" y="70" width="178" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"></rect><text x="315" y="104" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Easy rolling</text><text x="315" y="136" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Short strokes, no lean</text><text x="315" y="176" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">10 minutes</text><rect x="420" y="70" width="178" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"></rect><text x="509" y="104" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Build range</text><text x="509" y="136" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Deeper position, test grip</text><text x="509" y="176" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">10 minutes</text><rect x="614" y="70" width="178" height="120" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="3"></rect><text x="703" y="104" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4. Hard efforts</text><text x="703" y="136" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Intervals and sprints</text><text x="703" y="176" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Main set</text><text x="32" y="228" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">Roughly double the summer warm up. Everything hard happens once you, the oil and the urethane are warm.</text></svg></div>
