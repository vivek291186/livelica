<!-- Inline SVG diagrams from https://www.livelica.com/blogs/short-track/why-has-my-sharpening-stone-stopped-cutting (in article order) -->
<svg viewbox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flat versus dished stone" style="width:100%;height:auto;max-width:820px"><rect x="0" y="0" width="820" height="400" fill="#0f172a"></rect><text x="410" y="40" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">A flat stone and a dished stone, seen end on</text><text x="205" y="80" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Flat stone</text><rect x="70" y="150" width="270" height="52" fill="#334155" stroke="#22c55e" stroke-width="3"></rect><line x1="70" y1="150" x2="340" y2="150" stroke="#22c55e" stroke-width="5"></line><rect x="90" y="104" width="230" height="46" fill="#1e293b" stroke="#475569" stroke-width="2"></rect><line x1="90" y1="150" x2="320" y2="150" stroke="#22c55e" stroke-width="6"></line><text x="205" y="238" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Full width contact, all the way across</text><text x="205" y="262" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Result: a flat bottom with two square corners</text><rect x="120" y="292" width="170" height="62" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect><line x1="120" y1="354" x2="290" y2="354" stroke="#22c55e" stroke-width="6"></line><circle cx="120" cy="354" r="9" fill="none" stroke="#22c55e" stroke-width="3"></circle><circle cx="290" cy="354" r="9" fill="none" stroke="#22c55e" stroke-width="3"></circle><text x="615" y="80" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Dished stone</text><path d="M480 150 Q615 206 750 150 L750 202 L480 202 Z" fill="#334155" stroke="#f97316" stroke-width="3"></path><path d="M480 150 Q615 206 750 150" fill="none" stroke="#f97316" stroke-width="5"></path><rect x="500" y="112" width="230" height="46" fill="#1e293b" stroke="#475569" stroke-width="2"></rect><line x1="500" y1="158" x2="730" y2="158" stroke="#f97316" stroke-width="6"></line><circle cx="500" cy="158" r="7" fill="none" stroke="#f97316" stroke-width="3"></circle><circle cx="730" cy="158" r="7" fill="none" stroke="#f97316" stroke-width="3"></circle><text x="615" y="173" fill="#fbbf24" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">gap</text><text x="615" y="238" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The high shoulders touch, so they take the cut</text><text x="615" y="262" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Result: a curved bottom and rolled corners</text><path d="M530 292 L700 292 L700 330 Q700 354 676 354 L554 354 Q530 354 530 330 Z" fill="#1e293b" stroke="#f97316" stroke-width="2"></path><path d="M530 330 Q530 354 554 354 L676 354 Q700 354 700 330" fill="none" stroke="#f97316" stroke-width="6"></path><text x="410" y="386" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">The lower shapes are the blade edge each stone leaves behind</text></svg>

<svg viewbox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Straight edge test" style="width:100%;height:auto;max-width:820px"><rect x="0" y="0" width="820" height="300" fill="#0f172a"></rect><text x="410" y="38" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">The straight edge test, held up to a lamp</text><rect x="70" y="120" width="290" height="14" fill="#94a3b8"></rect><text x="215" y="108" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">straight edge</text><rect x="70" y="134" width="290" height="46" fill="#334155" stroke="#22c55e" stroke-width="3"></rect><text x="215" y="208" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">No light shows through</text><text x="215" y="234" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The face is flat. Carry on sharpening.</text><rect x="460" y="120" width="290" height="14" fill="#94a3b8"></rect><text x="605" y="108" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">straight edge</text><path d="M460 134 L750 134 L750 180 L460 180 Z" fill="#334155"></path><path d="M460 134 Q605 168 750 134" fill="#fbbf24"></path><path d="M460 134 Q605 168 750 134" fill="none" stroke="#f97316" stroke-width="4"></path><path d="M460 134 L460 180 L750 180 L750 134" fill="none" stroke="#f97316" stroke-width="3"></path><text x="605" y="208" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A sliver of light in the middle</text><text x="605" y="234" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The face is dished. Flatten it before you touch a blade.</text><text x="410" y="276" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Check along the length and across the width, because stones wear in both directions</text></svg>

<svg viewbox="0 0 820 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pencil grid flattening" style="width:100%;height:auto;max-width:820px">
<rect x="0" y="0" width="820" height="370" fill="#0f172a"></rect>
<text x="40" y="42" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold">Flattening a stone, read by the pencil marks</text>
<text x="128" y="86" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. Draw the grid</text>
<rect x="40" y="104" width="176" height="104" fill="#334155" stroke="#64748b" stroke-width="3"></rect>
<line x1="84" y1="104" x2="84" y2="208" stroke="#38bdf8" stroke-width="2"></line>
<line x1="128" y1="104" x2="128" y2="208" stroke="#38bdf8" stroke-width="2"></line>
<line x1="172" y1="104" x2="172" y2="208" stroke="#38bdf8" stroke-width="2"></line>
<line x1="40" y1="139" x2="216" y2="139" stroke="#38bdf8" stroke-width="2"></line>
<line x1="40" y1="174" x2="216" y2="174" stroke="#38bdf8" stroke-width="2"></line>
<text x="128" y="238" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Pencil lines across</text>
<text x="128" y="258" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">the whole working face</text>
<text x="410" y="86" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Lap and look</text>
<rect x="322" y="104" width="176" height="104" fill="#334155" stroke="#64748b" stroke-width="3"></rect>
<line x1="388" y1="104" x2="388" y2="208" stroke="#38bdf8" stroke-width="2"></line>
<line x1="410" y1="104" x2="410" y2="208" stroke="#38bdf8" stroke-width="2"></line>
<line x1="432" y1="104" x2="432" y2="208" stroke="#38bdf8" stroke-width="2"></line>
<line x1="381" y1="139" x2="439" y2="139" stroke="#38bdf8" stroke-width="2"></line>
<line x1="381" y1="174" x2="439" y2="174" stroke="#38bdf8" stroke-width="2"></line>
<text x="348" y="130" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">cut</text>
<text x="348" y="146" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">already</text>
<text x="472" y="130" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">cut</text>
<text x="472" y="146" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">already</text>
<text x="410" y="226" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">marks still here</text>
<text x="410" y="250" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The high ends clear first.</text>
<text x="410" y="270" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The hollow middle keeps its marks.</text>
<text x="692" y="86" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Marks all gone</text>
<rect x="604" y="104" width="176" height="104" fill="#334155" stroke="#22c55e" stroke-width="3"></rect>
<text x="692" y="162" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">flat across the face</text>
<text x="692" y="238" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Every square has been cut,</text>
<text x="692" y="258" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">so the whole face is level. Stop.</text>
<rect x="40" y="292" width="740" height="56" rx="10" fill="#111f36" stroke="#1e3a5f" stroke-width="2"></rect>
<text x="62" y="316" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14">Check with the straight edge as well as the marks, and stop the moment it reads flat.</text>
<text x="62" y="334" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14">Every pass costs stone you do not get back.</text>
</svg>
