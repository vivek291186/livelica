<!-- Short Track Cornering Technique: Crossovers, Lean and the Inside Hand Down. Inline SVG diagrams from the article body, in order. -->
<svg viewbox="0 0 820 320" role="img" aria-label="Front view diagram showing a skater leaning into a left corner with weight over the inside edges" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="320" fill="#0f172a"></rect><text x="30" y="40" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Leaning into the corner</text><line x1="80" y1="270" x2="760" y2="270" stroke="#334155" stroke-width="3"></line><line x1="300" y1="270" x2="470" y2="90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"></line><circle cx="485" cy="78" r="22" fill="#38bdf8"></circle><line x1="300" y1="270" x2="300" y2="90" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"></line><path d="M300 180 A 90 90 0 0 1 340 120" fill="none" stroke="#22c55e" stroke-width="3"></path><text x="330" y="150" fill="#22c55e" font-family="Arial, sans-serif" font-size="14">Lean angle</text><text x="500" y="120" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Head up, looking to the exit</text><text x="150" y="300" fill="#f97316" font-family="Arial, sans-serif" font-size="14">Weight drives down through the inside edges</text><line x1="560" y1="228" x2="700" y2="228" stroke="#22c55e" stroke-width="3"></line><polygon points="700,228 687,222 687,234" fill="#22c55e"></polygon><text x="560" y="212" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14">towards the centre of the turn</text></svg>
<svg viewbox="0 0 820 360" role="img" aria-label="Bird eye view of a short track crossover" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="360" fill="#0f172a"></rect><text x="30" y="40" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600">The crossover from above</text><path d="M 60 140 Q 330 300 600 140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"></path><text x="62" y="122" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="13">racing line</text><rect x="188" y="186" width="24" height="52" rx="8" fill="#38bdf8"></rect><text x="146" y="262" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">Left plants</text><rect x="268" y="150" width="24" height="52" rx="8" fill="#f97316" transform="rotate(-18 280 176)"></rect><text x="226" y="138" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="13">Right crosses over</text><rect x="358" y="202" width="24" height="52" rx="8" fill="#38bdf8"></rect><text x="316" y="278" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">Left pushes out</text><line x1="430" y1="250" x2="530" y2="250" stroke="#22c55e" stroke-width="3"></line><polygon points="530,250 517,244 517,256" fill="#22c55e"></polygon><text x="430" y="276" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="13">direction of travel</text><rect x="628" y="78" width="162" height="214" rx="10" fill="#111f36" stroke="#1e3a5f" stroke-width="2"></rect><rect x="650" y="104" width="16" height="22" rx="5" fill="#38bdf8"></rect><text x="676" y="121" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14">left skate</text><rect x="650" y="144" width="16" height="22" rx="5" fill="#f97316"></rect><text x="676" y="161" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14">right skate</text><text x="650" y="206" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">Short track turns left,</text><text x="650" y="228" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">so the inside of the</text><text x="650" y="250" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">bend is at the top of</text><text x="650" y="272" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">this view.</text></svg>
<svg viewbox="0 0 820 340" role="img" aria-label="When the inside hand goes down" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="340" fill="#0f172a"></rect><text x="30" y="40" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600">When the inside hand goes down</text><path d="M 110 130 Q 410 310 710 130" fill="none" stroke="#38bdf8" stroke-width="4"></path><path d="M 255 190 Q 410 236 565 190" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round"></path><circle cx="255" cy="190" r="9" fill="#22c55e"></circle><circle cx="565" cy="190" r="9" fill="#22c55e"></circle><text x="196" y="234" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14">Hand down</text><text x="556" y="234" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14">Hand lifts</text><text x="322" y="282" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">Light contact across the apex</text><circle cx="150" cy="152" r="8" fill="#f97316"></circle><text x="58" y="112" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="13">Do not reach early on entry</text><circle cx="670" cy="152" r="8" fill="#f97316"></circle><text x="556" y="112" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="13">Do not drag it onto the straight</text><text x="286" y="320" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="13">travel runs left to right, inside of the bend at the top</text></svg>
<svg viewbox="0 0 820 340" role="img" aria-label="Entry, apex and exit" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="340" fill="#0f172a"></rect><text x="30" y="40" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Entry, apex and exit</text><path d="M 120 130 Q 410 310 700 130" fill="none" stroke="#38bdf8" stroke-width="4"></path><circle cx="410" cy="146" r="18" fill="#334155"></circle><text x="388" y="152" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">block</text><circle cx="200" cy="173" r="10" fill="#22c55e"></circle><text x="100" y="230" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14">Entry, set the line</text><circle cx="410" cy="220" r="10" fill="#f97316"></circle><text x="340" y="254" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="14">Apex, maximum lean</text><circle cx="620" cy="173" r="10" fill="#22c55e"></circle><text x="536" y="230" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="14">Exit, drive onto the straight</text><line x1="300" y1="296" x2="520" y2="296" stroke="#22c55e" stroke-width="3"></line><polygon points="520,296 507,290 507,302" fill="#22c55e"></polygon><text x="300" y="322" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="13">direction of travel, block on your left</text></svg>
<svg viewbox="0 0 820 480" role="img" aria-label="Find the cause before you change the skate" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="480" fill="#0f172a"></rect><text x="30" y="44" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Find the cause before you change the skate</text><rect x="30" y="70" width="330" height="182" rx="12" fill="#111f36" stroke="#1e3a5f" stroke-width="2"></rect><text x="52" y="102" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Leaning: the edge carves</text><line x1="52" y1="200" x2="338" y2="200" stroke="#334155" stroke-width="3"></line><line x1="150" y1="200" x2="212" y2="126" stroke="#22c55e" stroke-width="9" stroke-linecap="round"></line><circle cx="150" cy="200" r="7" fill="#22c55e"></circle><path d="M 162 218 Q 236 232 304 214" fill="none" stroke="#22c55e" stroke-width="3"></path><polygon points="304,214 291,212 295,224" fill="#22c55e"></polygon><text x="186" y="244" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">holds the arc you asked for</text><rect x="30" y="268" width="330" height="182" rx="12" fill="#241407" stroke="#7c3d10" stroke-width="2"></rect><text x="52" y="300" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Upright: the edge skids</text><line x1="52" y1="398" x2="338" y2="398" stroke="#334155" stroke-width="3"></line><line x1="150" y1="398" x2="160" y2="322" stroke="#f97316" stroke-width="9" stroke-linecap="round"></line><circle cx="150" cy="398" r="7" fill="#f97316"></circle><line x1="172" y1="416" x2="300" y2="416" stroke="#f97316" stroke-width="3"></line><polygon points="300,416 287,410 287,422" fill="#f97316"></polygon><text x="172" y="442" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="13">washes sideways under load</text><text x="400" y="102" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Check the causes in this order</text><circle cx="414" cy="146" r="14" fill="#22c55e"></circle><text x="409" y="152" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">1</text><text x="442" y="142" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16">Body position and lean</text><text x="442" y="166" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">free, film one corner and look</text><circle cx="414" cy="214" r="14" fill="#22c55e"></circle><text x="409" y="220" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">2</text><text x="442" y="210" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16">Dull or burred edges</text><text x="442" y="234" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">check by feel first, then stone it</text><circle cx="414" cy="282" r="14" fill="#f97316"></circle><text x="409" y="288" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">3</text><text x="442" y="278" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16">Bend, rocker and alignment</text><text x="442" y="302" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">change one thing at a time</text><circle cx="414" cy="350" r="14" fill="#f97316"></circle><text x="409" y="356" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">4</text><text x="442" y="346" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16">Ice condition and entry speed</text><text x="442" y="370" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">nothing to fix, something to skate</text><rect x="392" y="396" width="398" height="54" rx="10" fill="#111f36" stroke="#1e3a5f" stroke-width="2"></rect><text x="414" y="428" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14">A setup change made too early hides what the body is doing.</text></svg>
