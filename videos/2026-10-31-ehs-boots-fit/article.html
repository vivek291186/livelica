<h2>Heat Moulding: What It Does and How to Approach It</h2>
<div style="margin:26px 0;">
<svg viewbox="0 0 820 240" role="img" aria-label="Four step heat moulding sequence" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="240" fill="#0f172a"></rect>
<text x="40" y="44" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Heat moulding, step by step</text>
<rect x="40" y="80" width="160" height="100" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="3"></rect>
<text x="120" y="122" fill="#f97316" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">1. Warm</text>
<text x="120" y="150" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Soften the shell</text>
<rect x="240" y="80" width="160" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"></rect>
<text x="320" y="122" fill="#38bdf8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">2. Lace on</text>
<text x="320" y="150" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Onto your foot</text>
<rect x="440" y="80" width="160" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"></rect>
<text x="520" y="122" fill="#38bdf8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">3. Hold</text>
<text x="520" y="150" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Skating posture</text>
<rect x="640" y="80" width="160" height="100" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="3"></rect>
<text x="720" y="122" fill="#22c55e" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">4. Cool</text>
<text x="720" y="150" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Let it set fully</text>
<rect x="203" y="128" width="22" height="6" fill="#64748b"></rect>
<polygon points="225,122 238,131 225,140" fill="#64748b"></polygon>
<rect x="403" y="128" width="22" height="6" fill="#64748b"></rect>
<polygon points="425,122 438,131 425,140" fill="#64748b"></polygon>
<rect x="603" y="128" width="22" height="6" fill="#64748b"></rect>
<polygon points="625,122 638,131 625,140" fill="#64748b"></polygon>
<text x="410" y="220" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Wear your race socks and do not over tighten the laces while the shell cools</text>
</svg>
</div>
<h2>What Heat Moulding Can and Cannot Fix</h2>
<div style="margin:26px 0;">
<svg viewbox="0 0 820 340" role="img" aria-label="What heat moulding can and cannot change" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="340" fill="#0f172a"></rect>
<text x="40" y="42" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Shape, not size</text>
<rect x="40" y="76" width="350" height="226" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="3"></rect>
<text x="66" y="110" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Moulding can change</text>
<text x="66" y="146" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">Room around an ankle bone</text>
<text x="66" y="176" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">Room over a high instep</text>
<text x="66" y="206" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">Relief at a bunion or a navicular</text>
<text x="66" y="236" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">How closely the heel cup wraps</text>
<text x="66" y="276" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">All of these are local shape problems</text>
<rect x="430" y="76" width="350" height="226" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="3"></rect>
<text x="456" y="110" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Moulding cannot change</text>
<text x="456" y="146" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">The length of the boot</text>
<text x="456" y="176" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">A shell that is too roomy overall</text>
<text x="456" y="206" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">A full width grade</text>
<text x="456" y="236" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">A last that suits a different foot</text>
<text x="456" y="276" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">These are sizing problems, so size correctly first</text>
</svg>
</div>
<h2>After the Mould: How to Check It Actually Worked</h2>
<div style="margin:26px 0;">
<svg viewbox="0 0 820 320" role="img" aria-label="Symptom map after moulding" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="320" fill="#0f172a"></rect>
<text x="40" y="42" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Reading the boot after a mould</text>
<text x="40" y="74" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">Symptom on the left, likely cause in the middle, what to do on the right</text>
<rect x="40" y="94" width="740" height="46" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect>
<text x="58" y="123" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">One sharp spot</text>
<text x="262" y="123" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">a bony area the shell did not clear</text>
<text x="572" y="123" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="15">local relief, not a full remould</text>
<rect x="40" y="150" width="740" height="46" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect>
<text x="58" y="179" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Heel lifting</text>
<text x="262" y="179" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">too much volume for your foot</text>
<text x="572" y="179" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="15">check lacing, then check size</text>
<rect x="40" y="206" width="740" height="46" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect>
<text x="58" y="235" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Pain across the top</text>
<text x="262" y="235" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">lace pressure at the flex point</text>
<text x="572" y="235" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="15">relax the top, firm the midfoot</text>
<rect x="40" y="262" width="740" height="46" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect>
<text x="58" y="291" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Numb toes</text>
<text x="262" y="291" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15">compression, often from the mould</text>
<text x="572" y="291" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="15">stop and have it checked</text>
</svg>
</div>
