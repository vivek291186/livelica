<div style="margin:26px 0;">
<svg viewbox="0 0 820 430" role="img" aria-label="Bar chart comparing three race pacing shapes across five parts of a race: a fast start that fades, an even pace, and a slightly rising pace" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">

<text x="36" y="66" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14">Bar height is your speed across five equal parts of the race. Same engine, same distance.</text>
<text x="36" y="128" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Start too fast</text>
<text x="36" y="150" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">fades early</text>
<rect x="230" y="100" width="80" height="70" fill="#f97316" opacity="0.85"></rect>
<rect x="330" y="112" width="80" height="58" fill="#f97316" opacity="0.75"></rect>
<rect x="430" y="124" width="80" height="46" fill="#f97316" opacity="0.65"></rect>
<rect x="530" y="136" width="80" height="34" fill="#f97316" opacity="0.55"></rect>
<rect x="630" y="144" width="80" height="26" fill="#f97316" opacity="0.45"></rect>
<line x1="220" y1="170" x2="730" y2="170" stroke="#475569" stroke-width="2"></line>
<text x="36" y="238" fill="#38bdf8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Even pace</text>
<text x="36" y="260" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">holds all the way to the line</text>
<rect x="230" y="232" width="80" height="48" fill="#38bdf8" opacity="0.8"></rect>
<rect x="330" y="232" width="80" height="48" fill="#38bdf8" opacity="0.8"></rect>
<rect x="430" y="232" width="80" height="48" fill="#38bdf8" opacity="0.8"></rect>
<rect x="530" y="232" width="80" height="48" fill="#38bdf8" opacity="0.8"></rect>
<rect x="630" y="232" width="80" height="48" fill="#38bdf8" opacity="0.8"></rect>
<line x1="220" y1="280" x2="730" y2="280" stroke="#475569" stroke-width="2"></line>
<text x="36" y="348" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Slightly rising</text>
<text x="36" y="370" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">fastest at the end</text>
<rect x="230" y="350" width="80" height="40" fill="#22c55e" opacity="0.6"></rect>
<rect x="330" y="346" width="80" height="44" fill="#22c55e" opacity="0.68"></rect>

<rect x="530" y="338" width="80" height="52" fill="#22c55e" opacity="0.84"></rect>
<rect x="630" y="332" width="80" height="58" fill="#22c55e" opacity="0.92"></rect>
<line x1="220" y1="390" x2="730" y2="390" stroke="#475569" stroke-width="2"></line>
</svg>
</div>
<div style="margin:26px 0;">
<svg viewbox="0 0 820 300" role="img" aria-label="Diagram splitting a distance race into three phases with instructions for each: hold back, sit on pace, and spend what is left" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="300" fill="#0f172a"></rect>
<text x="36" y="42" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">One plan for a distance race</text>
<text x="60" y="96" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13">start</text>
<text x="760" y="96" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end">finish</text>
<rect x="60" y="110" width="233" height="70" rx="8" fill="#38bdf8" opacity="0.22" stroke="#38bdf8" stroke-width="2"></rect>
<rect x="293" y="110" width="233" height="70" fill="#38bdf8" opacity="0.4" stroke="#38bdf8" stroke-width="2"></rect>
<rect x="526" y="110" width="234" height="70" rx="8" fill="#22c55e" opacity="0.4" stroke="#22c55e" stroke-width="2"></rect>
<text x="176" y="142" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">First third</text>
<text x="176" y="164" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">a shade easier than target</text>
<text x="410" y="142" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Middle third</text>
<text x="410" y="164" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">exactly on target</text>
<text x="643" y="142" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Final third</text>
<text x="643" y="164" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">spend what is left</text>
<text x="176" y="216" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">It should feel too easy.</text>
<text x="176" y="236" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">That is the point.</text>
<text x="410" y="216" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Check one lap time.</text>
<text x="410" y="236" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Hold your position.</text>
<text x="643" y="216" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Stop managing the race.</text>
<text x="643" y="236" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Empty the tank.</text>
<text x="60" y="276" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="14">If the first third feels hard, the plan has already failed. Start easing off now rather than at halfway.</text>
</svg>
</div>
