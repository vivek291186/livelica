<h2>How to check whether your blade ends are rounded</h2>
<div style="margin:26px 0;">
<svg viewbox="0 0 820 340" role="img" aria-label="Side view comparison of two short track blade tips, one finishing in a square corner and one finishing as a rounded curve with a 10 mm minimum radius" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="340" fill="#0f172a"></rect>
<text x="410" y="44" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">The end profile, seen from the side</text>
<text x="195" y="92" fill="#f97316" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Square corner</text>
<rect x="50" y="120" width="300" height="26" rx="5" fill="#334155"></rect>
<text x="200" y="138" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">tube</text>
<rect x="50" y="146" width="300" height="46" fill="#94a3b8"></rect>
<path d="M350 146 L350 192" stroke="#f97316" stroke-width="7"></path>
<path d="M350 192 L300 192" stroke="#f97316" stroke-width="7"></path>
<circle cx="350" cy="192" r="19" fill="none" stroke="#f97316" stroke-width="3"></circle>
<text x="200" y="248" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">The steel stops dead and leaves a point.</text>
<text x="200" y="272" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Tighter than the circle, so under radius.</text>
<text x="625" y="92" fill="#22c55e" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Rounded end</text>
<rect x="470" y="120" width="300" height="26" rx="5" fill="#334155"></rect>
<text x="620" y="138" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">tube</text>
<path d="M470 146 L748 146 Q770 146 770 169 Q770 192 748 192 L470 192 Z" fill="#94a3b8"></path>
<path d="M748 146 Q770 146 770 169 Q770 192 748 192" fill="none" stroke="#22c55e" stroke-width="7"></path>
<circle cx="748" cy="169" r="23" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 5"></circle>
<line x1="748" y1="169" x2="771" y2="169" stroke="#22c55e" stroke-width="2"></line>
<text x="690" y="228" fill="#22c55e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">10 mm minimum radius</text>
<text x="620" y="268" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">The end finishes as a continuous curve.</text>
<text x="410" y="312" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Four ends to check: front and back on each blade.</text>
</svg>
<p><em>Judge the curve from the side, at the front and the back of both blades.</em></p>
</div>
<h2>How to round a tip yourself</h2>
<div style="margin:26px 0;">
<svg viewbox="0 0 820 300" role="img" aria-label="Side view of a short track blade showing the two end zones that may be shaped in green and the running surface in the middle that must be left untouched" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="300" fill="#0f172a"></rect>
<text x="410" y="44" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Shape the ends, leave the middle alone</text>
<rect x="90" y="96" width="640" height="28" rx="6" fill="#334155"></rect>
<text x="410" y="115" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">tube</text>
<rect x="90" y="124" width="640" height="48" rx="24" fill="#94a3b8"></rect>
<rect x="90" y="124" width="78" height="48" rx="24" fill="#22c55e" opacity="0.55"></rect>
<rect x="652" y="124" width="78" height="48" rx="24" fill="#22c55e" opacity="0.55"></rect>
<line x1="168" y1="172" x2="652" y2="172" stroke="#38bdf8" stroke-width="7"></line>
<text x="129" y="208" fill="#22c55e" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">shape here</text>
<text x="691" y="208" fill="#22c55e" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">shape here</text>
<text x="410" y="208" fill="#38bdf8" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">running surface, leave it alone</text>
<text x="410" y="236" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">your rocker, your bend and your edges all live in this blue section</text>
<text x="410" y="272" fill="#f97316" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Take a stone to it and you have changed how the blade skates.</text>
</svg>
<p><em>Only the ends are in play. Everything between them is the setup you spent a season getting used to.</em></p>
</div>
