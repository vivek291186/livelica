<h1>How to Sharpen Short Track Blades: A Complete Guide to Jigs, Stones and Edges</h1>
<p>Article diagrams, in order of appearance. Full article at https://www.livelica.com/blogs/short-track/how-to-sharpen-short-track-blades-a-complete-guide-to-jigs-stones-and-edges</p>

<div style="margin:26px 0;">

<text x="150" y="82" fill="#22c55e" font-size="17" font-weight="bold" text-anchor="middle">Square and sharp</text>
<rect x="105" y="112" width="90" height="178" fill="#1e293b" stroke="#475569" stroke-width="2"></rect>
<line x1="105" y1="290" x2="195" y2="290" stroke="#22c55e" stroke-width="7"></line>

<text x="150" y="352" fill="#94a3b8" font-size="13" text-anchor="middle">Holds under lean. Reflects no light.</text>
<text x="410" y="82" fill="#f97316" font-size="17" font-weight="bold" text-anchor="middle">Rounded and dull</text>

<path d="M365 268 Q365 290 387 290 L433 290 Q455 290 455 268" fill="none" stroke="#f97316" stroke-width="7"></path>
<text x="410" y="330" fill="#e2e8f0" font-size="14" text-anchor="middle">Corners worn away to a curve.</text>
<text x="410" y="352" fill="#94a3b8" font-size="13" text-anchor="middle">Washes out mid corner.</text>
<text x="410" y="372" fill="#94a3b8" font-size="13" text-anchor="middle">Shines under a lamp.</text>
<text x="670" y="82" fill="#f97316" font-size="17" font-weight="bold" text-anchor="middle">Sharp but burred</text>

</svg>
</div>

<div style="margin:26px 0;">
<svg viewbox="0 0 820 500" role="img" aria-label="Six step sequence diagram for sharpening a short track blade from clamping in the jig to checking the edge under a light" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="820" height="500" fill="#0f172a"></rect>
<g font-family="Helvetica, Arial, sans-serif">
<text x="410" y="42" fill="#38bdf8" font-size="21" font-weight="bold" text-anchor="middle">The order of operations</text>
<line x1="102" y1="95" x2="102" y2="455" stroke="#334155" stroke-width="3"></line>
<rect x="60" y="68" width="700" height="54" rx="9" fill="#1e293b" stroke="#334155" stroke-width="2"></rect>
<circle cx="102" cy="95" r="19" fill="#38bdf8"></circle>
<text x="102" y="102" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="140" y="101" fill="#e2e8f0" font-size="16">Clamp both blades straight, then tighten the four knobs firmly</text>
<rect x="60" y="140" width="700" height="54" rx="9" fill="#1e293b" stroke="#334155" stroke-width="2"></rect>
<circle cx="102" cy="167" r="19" fill="#f97316"></circle>
<text x="102" y="174" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="140" y="173" fill="#e2e8f0" font-size="16">Coarse side of the stone, only if there is real damage to remove</text>
<rect x="60" y="212" width="700" height="54" rx="9" fill="#1e293b" stroke="#334155" stroke-width="2"></rect>
<circle cx="102" cy="239" r="19" fill="#38bdf8"></circle>
<text x="102" y="246" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="140" y="245" fill="#e2e8f0" font-size="16">Fine side, long even passes, pressure constant end to end</text>
<rect x="60" y="284" width="700" height="54" rx="9" fill="#1e293b" stroke="#334155" stroke-width="2"></rect>
<circle cx="102" cy="311" r="19" fill="#38bdf8"></circle>
<text x="102" y="318" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="140" y="317" fill="#e2e8f0" font-size="16">Diamond deburr stone, light passes down both sides</text>
<rect x="60" y="356" width="700" height="54" rx="9" fill="#1e293b" stroke="#334155" stroke-width="2"></rect>
<circle cx="102" cy="383" r="19" fill="#38bdf8"></circle>
<text x="102" y="390" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">5</text>
<text x="140" y="389" fill="#e2e8f0" font-size="16">Polishing triangle: blue, then green, then pink, a minute each</text>
<rect x="60" y="428" width="700" height="54" rx="9" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect>
<circle cx="102" cy="455" r="19" fill="#22c55e"></circle>
<text x="102" y="462" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">6</text>
<text x="140" y="461" fill="#e2e8f0" font-size="16">Check under a light. A truly sharp edge reflects nothing back</text>
</g>
</svg>
</div>

<div style="margin:26px 0;">
<svg viewbox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram comparing a flat sharpening stone producing a square blade edge with a stone dished in the middle that rounds the corners of the blade" style="width:100%;height:auto;max-width:820px"><rect x="0" y="0" width="820" height="400" fill="#0f172a"></rect><text x="410" y="40" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">A flat stone and a dished stone, seen end on</text><text x="205" y="80" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Flat stone</text><rect x="70" y="150" width="270" height="52" fill="#334155" stroke="#22c55e" stroke-width="3"></rect><line x1="70" y1="150" x2="340" y2="150" stroke="#22c55e" stroke-width="5"></line><rect x="160" y="96" width="90" height="46" fill="#1e293b" stroke="#475569" stroke-width="2"></rect><line x1="160" y1="142" x2="250" y2="142" stroke="#22c55e" stroke-width="6"></line><text x="205" y="238" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Full width contact, all the way across</text><text x="205" y="262" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Result: a flat bottom with two square corners</text><rect x="120" y="292" width="170" height="62" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect><line x1="120" y1="354" x2="290" y2="354" stroke="#22c55e" stroke-width="6"></line><circle cx="120" cy="354" r="9" fill="none" stroke="#22c55e" stroke-width="3"></circle><circle cx="290" cy="354" r="9" fill="none" stroke="#22c55e" stroke-width="3"></circle><text x="615" y="80" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Dished stone</text><path d="M480 150 Q615 186 750 150 L750 202 L480 202 Z" fill="#334155" stroke="#f97316" stroke-width="3"></path><path d="M480 150 Q615 186 750 150" fill="none" stroke="#f97316" stroke-width="5"></path><rect x="570" y="96" width="90" height="46" fill="#1e293b" stroke="#475569" stroke-width="2"></rect><path d="M570 142 Q615 156 660 142" fill="none" stroke="#f97316" stroke-width="6"></path><text x="615" y="238" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Only the worn centre touches the steel</text><text x="615" y="262" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Result: a curved bottom and rolled corners</text><path d="M530 292 L700 292 L700 330 Q700 354 676 354 L554 354 Q530 354 530 330 Z" fill="#1e293b" stroke="#f97316" stroke-width="2"></path><path d="M530 330 Q530 354 554 354 L676 354 Q700 354 700 330" fill="none" stroke="#f97316" stroke-width="6"></path><text x="410" y="386" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">The lower shapes are the blade edge each stone leaves behind</text></svg>
</div>

<div style="margin:26px 0;">
<svg viewbox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the straight edge test on a sharpening stone, showing no light visible under a flat stone and a sliver of light visible in the middle under a dished stone" style="width:100%;height:auto;max-width:820px"><rect x="0" y="0" width="820" height="300" fill="#0f172a"></rect><text x="410" y="38" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">The straight edge test, held up to a lamp</text><rect x="70" y="120" width="290" height="14" fill="#94a3b8"></rect><text x="215" y="108" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">straight edge</text><rect x="70" y="134" width="290" height="46" fill="#334155" stroke="#22c55e" stroke-width="3"></rect><text x="215" y="208" fill="#22c55e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">No light shows through</text><text x="215" y="234" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The face is flat. Carry on sharpening.</text><rect x="460" y="120" width="290" height="14" fill="#94a3b8"></rect><text x="605" y="108" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">straight edge</text><path d="M460 134 L750 134 L750 180 L460 180 Z" fill="#334155"></path><path d="M460 134 Q605 168 750 134" fill="#0f172a"></path><path d="M460 134 Q605 168 750 134" fill="none" stroke="#f97316" stroke-width="4"></path><rect x="460" y="134" width="290" height="46" fill="none" stroke="#f97316" stroke-width="3"></rect><text x="605" y="208" fill="#f97316" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A sliver of light in the middle</text><text x="605" y="234" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">The face is dished. Flatten it before you touch a blade.</text><text x="410" y="276" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Check along the length and across the width, because stones wear in both directions</text></svg>
</div>
