<h2>Why short track steel rusts so quickly</h2>
<svg viewbox="0 0 820 330" role="img" aria-label="Cross section diagram of a short track blade showing a thin water film and grit sitting on the ground steel, with rust forming at the edge where moisture is trapped" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="330" fill="#0f172a"></rect><text x="410" y="40" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">What sits on your steel after a session</text><rect x="260" y="90" width="300" height="90" fill="#475569"></rect><polygon points="260,180 560,180 560,215 410,240 260,215" fill="#64748b"></polygon><text x="410" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="16" text-anchor="middle">blade steel</text><rect x="260" y="82" width="300" height="8" fill="#38bdf8"></rect><circle cx="320" cy="78" r="5" fill="#38bdf8"></circle><circle cx="400" cy="76" r="6" fill="#38bdf8"></circle><circle cx="480" cy="78" r="5" fill="#38bdf8"></circle><circle cx="350" cy="70" r="3" fill="#94a3b8"></circle><circle cx="440" cy="68" r="3" fill="#94a3b8"></circle><circle cx="520" cy="71" r="3" fill="#94a3b8"></circle><circle cx="410" cy="243" r="7" fill="#f97316"></circle><circle cx="340" cy="223" r="5" fill="#f97316"></circle><circle cx="480" cy="223" r="5" fill="#f97316"></circle><line x1="600" y1="86" x2="680" y2="86" stroke="#64748b" stroke-width="1.5"></line><text x="690" y="91" fill="#38bdf8" font-family="sans-serif" font-size="15">water film</text><line x1="600" y1="70" x2="680" y2="60" stroke="#64748b" stroke-width="1.5"></line><text x="690" y="64" fill="#94a3b8" font-family="sans-serif" font-size="15">grit and dust</text><line x1="440" y1="243" x2="680" y2="250" stroke="#64748b" stroke-width="1.5"></line><text x="690" y="255" fill="#f97316" font-family="sans-serif" font-size="15">rust starts</text><text x="140" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">the edge is the</text><text x="140" y="222" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">thinnest steel, so</text><text x="140" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">it corrodes first</text></svg>
<h2>What soakers actually do</h2>
<svg viewbox="0 0 820 360" role="img" aria-label="Comparison diagram showing hard guards used for walking and fabric soakers used for storage" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="360" fill="#0f172a"></rect><text x="410" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Two covers, two completely different jobs</text><rect x="50" y="70" width="340" height="250" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect><text x="220" y="105" fill="#22c55e" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Hard guards, for walking</text><rect x="100" y="140" width="240" height="14" fill="#64748b"></rect><rect x="96" y="152" width="248" height="22" rx="8" fill="#334155" stroke="#22c55e" stroke-width="2"></rect><text x="220" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">rigid shell takes the abuse of</text><text x="220" y="228" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">floors, matting and concrete</text><text x="220" y="268" fill="#f97316" font-family="sans-serif" font-size="15" text-anchor="middle">traps water if you store in them</text><text x="220" y="294" fill="#f97316" font-family="sans-serif" font-size="15" text-anchor="middle">so take them off at home</text><rect x="430" y="70" width="340" height="250" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect><text x="600" y="105" fill="#38bdf8" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Soakers, for the bag</text><rect x="480" y="140" width="240" height="14" fill="#64748b"></rect><rect x="474" y="150" width="252" height="26" rx="13" fill="#334155" stroke="#38bdf8" stroke-width="2"></rect><path d="M500 150 L508 176 M530 150 L538 176 M560 150 L568 176 M590 150 L598 176 M620 150 L628 176 M650 150 L658 176 M680 150 L688 176" stroke="#38bdf8" stroke-width="2"></path><text x="600" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">terry cloth pulls moisture off</text><text x="600" y="228" fill="#e2e8f0" font-family="sans-serif" font-size="15" text-anchor="middle">the steel and holds it away</text><text x="600" y="268" fill="#22c55e" font-family="sans-serif" font-size="15" text-anchor="middle">use for storage and transport</text><text x="600" y="294" fill="#22c55e" font-family="sans-serif" font-size="15" text-anchor="middle">dry them out between sessions</text><text x="410" y="345" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">Most skaters carry both, and swap over at the barrier</text></svg>
<h2>The ninety second post session routine</h2>
<svg viewbox="0 0 820 260" role="img" aria-label="Five step sequence diagram of the post session blade routine" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="260" fill="#0f172a"></rect><text x="410" y="40" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">The routine, in order</text><rect x="25" y="80" width="130" height="96" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect><text x="90" y="112" fill="#38bdf8" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="90" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">guards on at</text><text x="90" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">the barrier</text><rect x="185" y="80" width="130" height="96" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect><text x="250" y="112" fill="#38bdf8" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="250" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">sit and take</text><text x="250" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">the boots off</text><rect x="345" y="80" width="130" height="96" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect><text x="410" y="112" fill="#38bdf8" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="410" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">guards off,</text><text x="410" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">wipe it all dry</text><rect x="505" y="80" width="130" height="96" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect><text x="570" y="112" fill="#38bdf8" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="570" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">let the steel</text><text x="570" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">air a few mins</text><rect x="665" y="80" width="130" height="96" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect><text x="730" y="112" fill="#22c55e" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="730" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">soakers on</text><text x="730" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">for the bag</text><path d="M158 128 L182 128 M318 128 L342 128 M478 128 L502 128 M638 128 L662 128" stroke="#64748b" stroke-width="2"></path><text x="410" y="225" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">At home, open the bag, pull the soakers off and let everything dry fully</text></svg>
<h2>Reading rust: haze, speckling or pitting</h2>
<svg viewbox="0 0 820 330" role="img" aria-label="Three stage diagram of rust progressing from grey haze to speckling to pitting" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="820" height="330" fill="#0f172a"></rect><text x="410" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">How far has it gone</text><rect x="30" y="70" width="240" height="210" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect><text x="150" y="102" fill="#22c55e" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Stage 1, grey haze</text><rect x="60" y="120" width="180" height="30" fill="#64748b"></rect><rect x="60" y="120" width="180" height="30" fill="#94a3b8" opacity="0.55"></rect><text x="150" y="180" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">bright steel has gone</text><text x="150" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">dull and cloudy</text><text x="150" y="235" fill="#22c55e" font-family="sans-serif" font-size="14" text-anchor="middle">wipe it dry, keep skating,</text><text x="150" y="255" fill="#22c55e" font-family="sans-serif" font-size="14" text-anchor="middle">no steel lost</text><rect x="290" y="70" width="240" height="210" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect><text x="410" y="102" fill="#f97316" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Stage 2, speckling</text><rect x="320" y="120" width="180" height="30" fill="#64748b"></rect><circle cx="350" cy="132" r="4" fill="#f97316"></circle><circle cx="382" cy="140" r="3" fill="#f97316"></circle><circle cx="414" cy="128" r="4" fill="#f97316"></circle><circle cx="446" cy="141" r="3" fill="#f97316"></circle><circle cx="478" cy="133" r="4" fill="#f97316"></circle><text x="410" y="180" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">fine orange dots, often</text><text x="410" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">near the edge or cups</text><text x="410" y="235" fill="#f97316" font-family="sans-serif" font-size="14" text-anchor="middle">clean it now with a stone,</text><text x="410" y="255" fill="#f97316" font-family="sans-serif" font-size="14" text-anchor="middle">before it eats in</text><rect x="550" y="70" width="240" height="210" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"></rect><text x="670" y="102" fill="#ef4444" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Stage 3, pitting</text><rect x="580" y="120" width="180" height="30" fill="#64748b"></rect><path d="M604 150 L612 134 L620 150 Z" fill="#0f172a"></path><path d="M652 150 L662 130 L672 150 Z" fill="#0f172a"></path><path d="M706 150 L714 136 L722 150 Z" fill="#0f172a"></path><text x="670" y="180" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">craters in the running</text><text x="670" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle">surface itself</text><text x="670" y="235" fill="#ef4444" font-family="sans-serif" font-size="14" text-anchor="middle">only a deep grind removes it,</text><text x="670" y="255" fill="#ef4444" font-family="sans-serif" font-size="14" text-anchor="middle">so blade life is lost</text><text x="410" y="308" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">The cost of fixing rust roughly doubles at every stage, so catch it early</text></svg>
