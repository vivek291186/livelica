<svg viewbox="0 0 820 360" role="img" aria-label="What holds and what fades" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"> <rect x="0" y="0" width="820" height="360" fill="#0f172a"></rect> <text x="410" y="40" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">What holds and what fades in a month off</text> <text x="410" y="66" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Spend your few hours on the middle column. Let the right hand column go.</text> <rect x="40" y="90" width="236" height="200" rx="12" fill="#111c33" stroke="#22c55e" stroke-width="3"></rect> <text x="158" y="126" fill="#22c55e" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Holds well</text> <text x="158" y="160" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Technique</text> <text x="158" y="186" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Push, edge, timing</text> <text x="158" y="222" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Needs almost nothing</text> <text x="158" y="246" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">to stay available</text> <text x="158" y="272" fill="#22c55e" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Cost to protect: low</text> <rect x="292" y="90" width="236" height="200" rx="12" fill="#111c33" stroke="#38bdf8" stroke-width="3"></rect> <text x="410" y="126" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Holds with a little</text> <text x="410" y="160" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Strength and top speed</text> <text x="410" y="186" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Starts, sprints, jumps</text> <text x="410" y="222" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">A few short hard efforts</text> <text x="410" y="246" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">keep these close</text> <text x="410" y="272" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Cost to protect: small</text> <rect x="544" y="90" width="236" height="200" rx="12" fill="#111c33" stroke="#f97316" stroke-width="3"></rect> <text x="662" y="126" fill="#f97316" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Fades fastest</text> <text x="662" y="160" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Aerobic fitness</text> <text x="662" y="186" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Holding a hard pace</text> <text x="662" y="222" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Built by volume you</text> <text x="662" y="246" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">do not have right now</text> <text x="662" y="272" fill="#f97316" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Cost to protect: high</text> <text x="410" y="330" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Aerobic fitness is also the quickest of the three to rebuild once the papers are over.</text> </svg>
<svg viewbox="0 0 820 380" role="img" aria-label="Exam week grid" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"> <rect x="0" y="0" width="820" height="380" fill="#0f172a"></rect> <text x="410" y="38" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">One exam week, ninety minutes of training</text> <text x="100" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Mon</text> <text x="200" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Tue</text> <text x="300" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Wed</text> <text x="400" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Thu</text> <text x="500" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Fri</text> <text x="600" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Sat</text> <text x="700" y="78" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Sun</text> <text x="40" y="118" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">Papers</text> <rect x="190" y="96" width="76" height="30" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect> <text x="228" y="116" fill="#f97316" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">paper</text> <rect x="490" y="96" width="76" height="30" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect> <text x="528" y="116" fill="#f97316" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">paper</text> <text x="40" y="178" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">Study</text> <rect x="90" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <rect x="190" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <rect x="290" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <rect x="390" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <rect x="490" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <rect x="590" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <rect x="690" y="156" width="76" height="30" rx="5" fill="#334155"></rect> <text x="40" y="238" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">Skate</text> <rect x="290" y="216" width="76" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect> <text x="328" y="236" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">30 min</text> <rect x="590" y="216" width="76" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect> <text x="628" y="236" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">30 min</text> <text x="40" y="288" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">Strength</text> <rect x="690" y="266" width="76" height="30" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect> <text x="728" y="286" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">15 min</text> <text x="40" y="338" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">Mobility</text> <rect x="90" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <rect x="190" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <rect x="290" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <rect x="390" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <rect x="490" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <rect x="590" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <rect x="690" y="316" width="76" height="26" rx="5" fill="#0b2a22" stroke="#22c55e" stroke-width="1"></rect> <text x="410" y="366" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Skates go on days with no paper the next morning. Everything else is small and daily.</text> </svg>
<svg viewbox="0 0 820 320" role="img" aria-label="Comeback ramp" style="width:100%;height:auto;max-width:820px" xmlns="http://www.w3.org/2000/svg"> <rect x="0" y="0" width="820" height="320" fill="#0f172a"></rect> <text x="410" y="38" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">The comeback ramp after your last paper</text> <line x1="70" y1="250" x2="770" y2="250" stroke="#475569" stroke-width="2"></line> <rect x="100" y="190" width="160" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"></rect> <text x="180" y="216" fill="#22c55e" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Week 1</text> <text x="180" y="238" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">3 easy sessions</text> <rect x="320" y="140" width="160" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"></rect> <text x="400" y="168" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Week 2</text> <text x="400" y="192" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1 hard session</text> <text x="400" y="214" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">rest steady</text> <rect x="540" y="86" width="160" height="164" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"></rect> <text x="620" y="114" fill="#f97316" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Week 3</text> <text x="620" y="138" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">normal training</text> <text x="620" y="160" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">resumes</text> <text x="410" y="286" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Two patient weeks cost less than the fortnight you lose to a blister or a strain.</text> </svg>
